<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#1b2a2f;--mut:#667a80;--bd:#dbe5e3;--pri:#1f4e5f;--ok:#2e7d6b;--bad:#d9381e;--empty:#d9e2e0;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181b;--card:#1a2529;--tx:#e8f0ef;--mut:#92a6ab;--bd:#2c3b40;--pri:#5fb3c9;--ok:#4fc3a1;--bad:#ff6a4d;--empty:#2c3b40;--inp:#121c1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:4px 0;color:var(--pri)}
h2{font-size:14px;margin:0 0 8px;color:var(--mut)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.top,.ch-row{display:flex;gap:8px;align-items:center}
.top{justify-content:space-between;margin-bottom:10px}
.ch-row{overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.ch{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:14px Arial;cursor:pointer}
.ch.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:bold}
input,button{font:16px Arial;border-radius:10px;border:1px solid var(--bd);padding:12px;background:var(--inp);color:var(--tx);min-width:0}
.b{background:var(--pri);color:#fff;border:0;font-weight:bold;cursor:pointer}
.g{background:none;cursor:pointer;color:var(--tx)}
.dg{color:var(--bad);cursor:pointer;background:none}
.f{display:grid;grid-template-columns:1fr 110px;gap:8px}
.f .b,.f .g,.pv{grid-column:1/-1}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k span{display:block;font-size:12px;color:var(--mut)}
.k b{font-size:19px}
.bar{height:12px;border-radius:8px;background:var(--empty);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.r:last-child{border:0}
.d{width:14px;height:14px;border-radius:4px;flex:none}
.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{font-weight:bold;width:52px;text-align:right}
.m{width:96px;text-align:right;color:var(--mut)}
.li{cursor:pointer}
.e{color:var(--mut);font-size:14px;text-align:center;padding:10px}
[hidden]{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.th{display:flex;flex-wrap:wrap;gap:8px}
.th div{position:relative}
.th img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in;display:block}
.th button{position:absolute;top:2px;right:2px;padding:0 7px;font-size:16px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;cursor:pointer}
.big{max-width:100%;max-height:80vh;border-radius:10px}
.er{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div id="ov" class="ov" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,updateDoc,getDocs,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== PEGA AQUÍ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps > Web) ===== */
const firebaseConfig={apiKey:"AIzaSyDWew9r_6XbZLol7Vvh4Bk0s8s8Uk88asM",authDomain:"mis-gastos-30291.firebaseapp.com",projectId:"mis-gastos-30291",storageBucket:"mis-gastos-30291.firebasestorage.app",messagingSenderId:"887277831553",appId:"1:887277831553:web:7bb99ecb81b07d4098d480"};
/* ========================================================================================= */

const COL=["#3caa35","#4a72b8","#e8401c","#f39c12","#8e5bb5","#1abc9c","#e91e8c","#795548","#00a8cc","#b8b800","#ff7f50","#5c6bc0"];
const $=i=>document.getElementById(i), app=$("app"), ov=$("ov");
const fm=n=>n.toLocaleString("es-PE",{style:"currency",currency:"PEN"});
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML.replace(/"/g,"&quot;")};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let auth,db,U=null,P=[],G=[],cur=null,unsubP=null,unsubG=null,pend=[];
const pc=()=>collection(db,"users",U.uid,"pasteles");
const gc=p=>collection(db,"users",U.uid,"pasteles",p,"gastos");
const fc=(p,g)=>collection(db,"users",U.uid,"pasteles",p,"gastos",g,"fotos");

if(firebaseConfig.apiKey==="PEGA_AQUI"){
  app.innerHTML='<div class="c"><h1>Falta la configuración</h1><p>Pega tu firebaseConfig en index.html (donde dice PEGA AQUÍ) y vuelve a subir la app.</p></div>';
}else{
  auth=getAuth(initializeApp(firebaseConfig));db=getFirestore();
  onAuthStateChanged(auth,u=>{U=u;if(unsubP)unsubP();if(unsubG)unsubG();u?start():login()});
}

const EMAIL="gastos@mis-gastos.app",PASS="alexus";
function login(msg){
  app.innerHTML='<div class="c" style="display:grid;gap:10px;margin-top:40px"><h1>Mis gastos</h1><p style="margin:0;color:var(--mut)">Escribe tu contraseña para entrar.</p><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="b" id="go">Entrar</button><div class="er" id="er">'+(msg||"")+'</div></div>';
  const er=t=>$("er").textContent=t;
  const enter=async()=>{
    if($("pw").value.trim().toLowerCase()!==PASS)return er("Contraseña incorrecta");
    $("go").disabled=true;er("Entrando…");
    try{await signInWithEmailAndPassword(auth,EMAIL,PASS)}
    catch(e){
      try{await createUserWithEmailAndPassword(auth,EMAIL,PASS)}
      catch(e2){const x=e2.code==="auth/email-already-in-use"?e:e2;er("No se pudo entrar: "+(x.code||x.message));$("go").disabled=false}
    }
  };
  $("go").onclick=enter;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
}

function start(){
  app.innerHTML='<div class="top"><h1>Mis gastos</h1><button class="g" id="out">Salir</button></div><div class="ch-row" id="chips"></div><div class="c" id="sum"></div>'
  +'<div class="c"><h2>Agregar gasto</h2><div class="f"><input id="nm" placeholder="¿En qué lo gastaste?" maxlength="40" autocomplete="off"><input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="S/ 0.00"><button class="g" id="ph">📷 Adjuntar comprobante</button><input id="pf" type="file" accept="image/*" multiple hidden><div class="th pv" id="pv"></div><button class="b" id="ad">Agregar</button></div></div>'
  +'<div class="c"><h2>¿En qué se fue el dinero?</h2><div id="pie"></div><div id="lg"></div></div><div class="c"><h2>Mis gastos</h2><div id="ls"></div></div>';
  $("out").onclick=()=>signOut(auth);
  $("ph").onclick=()=>$("pf").click();
  $("pf").onchange=async e=>{for(const f of e.target.files){try{pend.push(await comp(f))}catch(x){}}e.target.value="";prev()};
  $("ad").onclick=addG;
  ["nm","am"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")addG()}));
  $("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="np")return pasMod();pick(b.dataset.p)};
  $("sum").onclick=e=>{if(e.target.id==="ed")pasMod(cur)};
  $("ls").onclick=e=>{const r=e.target.closest(".li");if(r)gasMod(r.dataset.g)};
  unsubP=onSnapshot(pc(),s=>{
    P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.c-b.c);
    if(!P.length){setDoc(doc(pc(),"prestamo"),{name:"Préstamo",loan:14000,c:Date.now()});return}
    let sv=null;try{sv=localStorage.getItem("gp_cur")}catch(e){}
    if(!P.some(p=>p.id===cur))pick(P.some(p=>p.id===sv)?sv:P[0].id);else chips();
    sumr();
  });
}
function pick(id){
  cur=id;try{localStorage.setItem("gp_cur",id)}catch(e){}
  if(unsubG)unsubG();G=[];draw();
  unsubG=onSnapshot(gc(id),s=>{G=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.d-b.d);draw()});
  chips();
}
const P0=()=>P.find(p=>p.id===cur)||{name:"",loan:0};
function chips(){$("chips").innerHTML=P.map(p=>'<button class="ch'+(p.id===cur?" on":"")+'" data-p="'+p.id+'">'+esc(p.name)+'</button>').join("")+'<button class="ch" id="np">+ Nuevo pastel</button>'}
function groups(){
  const m={},o=[];
  G.forEach(it=>{const nm=(it.n||"").trim()||"Sin descripción",k=nm.toLowerCase();if(!m[k]){m[k]={n:nm,m:0,c:COL[o.length%COL.length]};o.push(m[k])}m[k].m+=it.m});
  return o.sort((a,b)=>b.m-a.m);
}
function sumr(){
  const p=P0(),tot=G.reduce((t,i)=>t+i.m,0),av=p.loan-tot;
  let h='<div class="top" style="margin:0 0 10px"><h2 style="margin:0;font-size:16px;color:var(--tx)">'+esc(p.name)+'</h2><button class="g" id="ed" style="padding:6px 12px;font-size:14px">Editar</button></div>';
  if(p.loan>0){
    const pc=tot/p.loan*100;
    h+='<div class="k"><div><span>Total</span><b>'+fm(p.loan)+'</b></div><div><span>Gastado</span><b style="color:var(--bad)">'+fm(tot)+'</b></div><div><span>Disponible</span><b style="color:var(--ok)">'+fm(Math.max(av,0))+'</b></div><div><span>Gastos</span><b>'+G.length+'</b></div></div>'
    +'<div class="bar"><i style="width:'+Math.min(pc,100)+'%;background:'+(av<0?"var(--bad)":"var(--ok)")+'"></i></div><b style="font-size:13px;color:'+(av<0?"var(--bad)":"var(--ok)")+'">'+(av<0?"Te pasaste por "+fm(-av):"Usaste "+pc.toFixed(1)+"% · te quedan "+fm(av))+'</b>';
  }else h+='<div class="k"><div><span>Total gastado</span><b style="color:var(--bad)">'+fm(tot)+'</b></div><div><span>Gastos</span><b>'+G.length+'</b></div></div>';
  $("sum").innerHTML=h;
}
function pie(gs,tot){
  let s='<svg viewBox="0 0 300 300" role="img" aria-label="Gráfico de gastos">';
  if(!tot)return s+'<circle cx="150" cy="150" r="140" fill="var(--empty)"/><text x="150" y="155" text-anchor="middle" fill="var(--mut)" font-size="15" font-family="Arial">Agrega tu primer gasto</text></svg>';
  let a=-Math.PI/2;
  gs.forEach(g=>{
    const f=g.m/tot,b=a+f*2*Math.PI,mid=(a+b)/2;
    if(gs.length===1)s+='<circle cx="150" cy="150" r="140" fill="'+g.c+'"/>';
    else s+='<path d="M150 150L'+(150+140*Math.cos(a)).toFixed(2)+' '+(150+140*Math.sin(a)).toFixed(2)+'A140 140 0 '+(f>.5?1:0)+' 1 '+(150+140*Math.cos(b)).toFixed(2)+' '+(150+140*Math.sin(b)).toFixed(2)+'Z" fill="'+g.c+'" stroke="#fff" stroke-width="3"/>';
    if(f>=.07){const x=(150+Math.cos(mid)*84).toFixed(1),y=150+Math.sin(mid)*84,n=g.n.length>12?g.n.slice(0,11)+"…":g.n;
      s+='<text x="'+x+'" y="'+y.toFixed(1)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="22">'+Math.round(f*100)+'%</text><text x="'+x+'" y="'+(y+16).toFixed(1)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="12">'+esc(n)+'</text>'}
    a=b;
  });
  return s+'</svg>';
}
function draw(){
  if(!$("pie"))return;
  const tot=G.reduce((t,i)=>t+i.m,0),gs=groups();
  sumr();$("pie").innerHTML=pie(gs,tot);
  $("lg").innerHTML=gs.map(g=>'<div class="r"><span class="d" style="background:'+g.c+'"></span><span class="n">'+esc(g.n)+'</span><span class="p">'+(g.m/tot*100).toFixed(1)+'%</span><span class="m">'+fm(g.m)+'</span></div>').join("");
  $("ls").innerHTML=G.length?G.slice().reverse().map(it=>{const d=new Date(it.d);return '<div class="r li" data-g="'+it.id+'"><span class="m" style="width:44px;text-align:left;font-size:11px">'+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+'</span><span class="n">'+esc((it.n||"").trim()||"Sin descripción")+(it.f?" 📎"+it.f:"")+'</span><span class="m" style="color:var(--tx)">'+fm(it.m)+'</span></div>'}).join(""):'<div class="e">Todavía no hay gastos en este pastel.</div>';
}
function prev(){$("pv").innerHTML=pend.map((x,i)=>'<div><img src="'+x+'" alt="Comprobante"><button data-i="'+i+'">×</button></div>').join("");$("pv").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){pend.splice(+i,1);prev()}}}
function comp(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.width,h=im.height;const s=1280/Math.max(w,h);if(s<1){w*=s;h*=s}const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL("image/jpeg",q);while(d.length>750000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}URL.revokeObjectURL(u);ok(d)};im.onerror=no;im.src=u})}
async function addG(){
  const m=parseFloat($("am").value);if(!(m>0)){$("am").focus();return}
  const b=writeBatch(db),g=doc(gc(cur));
  b.set(g,{n:$("nm").value,m:Math.round(m*100)/100,d:Date.now(),f:pend.length});
  pend.forEach(x=>b.set(doc(fc(cur,g.id),nid()),{x,c:Date.now()}));
  $("ad").disabled=true;
  try{await b.commit();$("nm").value="";$("am").value="";pend=[];prev()}catch(e){alert("No se pudo guardar: "+(e.code||e.message))}
  $("ad").disabled=false;$("nm").focus();
}
function modal(h){ov.innerHTML='<div class="md">'+h+'</div>';ov.hidden=false;ov.onclick=e=>{if(e.target===ov)shut()}}
function shut(){ov.hidden=true;ov.innerHTML=""}
function pasMod(id){
  const p=id?P0():{name:"",loan:0};
  modal('<h2>'+(id?"Editar pastel":"Nuevo pastel")+'</h2><input id="pn" placeholder="Nombre (ej. Gastos personales)" maxlength="30" value="'+esc(p.name)+'"><input id="pl" type="number" inputmode="decimal" min="0" placeholder="Monto total (opcional)" value="'+(p.loan||"")+'"><button class="b" id="ps">Guardar</button>'+(id&&P.length>1?'<button class="dg" id="pd">Borrar pastel</button>':"")+'<button class="g" id="px">Cancelar</button>');
  $("px").onclick=shut;
  $("ps").onclick=async()=>{const name=$("pn").value.trim();if(!name){$("pn").focus();return}const d={name,loan:parseFloat($("pl").value)||0};
    if(id)await updateDoc(doc(pc(),id),d);else{const r=doc(pc());await setDoc(r,{...d,c:Date.now()});shut();return pick(r.id)}shut()};
  if($("pd"))$("pd").onclick=async function(){
    if(this.dataset.s!=="1"){this.dataset.s="1";this.textContent="¿Seguro? Se borran sus gastos y fotos. Toca otra vez";return}
    this.disabled=true;const gs=await getDocs(gc(id));for(const g of gs.docs)await delG(id,g.id);
    await deleteDoc(doc(pc(),id));cur=null;shut();
  };
}
async function delG(p,g){const fs=await getDocs(fc(p,g)),b=writeBatch(db);fs.docs.forEach(f=>b.delete(f.ref));b.delete(doc(gc(p),g));await b.commit()}
async function gasMod(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  const d=new Date(g.d);
  modal('<h2>'+esc((g.n||"").trim()||"Sin descripción")+' · '+fm(g.m)+'</h2><div style="font-size:13px;color:var(--mut)">'+d.toLocaleDateString("es-PE")+'</div><div class="th" id="gf"><span class="e">Cargando comprobantes…</span></div><button class="g" id="gp">📷 Agregar comprobante</button><input id="gi" type="file" accept="image/*" multiple hidden><button class="dg" id="gd">Borrar gasto</button><button class="g" id="gx">Cerrar</button>');
  $("gx").onclick=shut;
  const load=async()=>{
    const fs=await getDocs(fc(cur,id));
    $("gf").innerHTML=fs.docs.length?fs.docs.map(f=>'<div><img src="'+f.data().x+'" alt="Comprobante" data-f="'+f.id+'"><button data-x="'+f.id+'">×</button></div>').join(""):'<span class="e">Sin comprobantes.</span>';
    $("gf").onclick=async e=>{
      if(e.target.dataset.x){await deleteDoc(doc(fc(cur,id),e.target.dataset.x));await updateDoc(doc(gc(cur),id),{f:Math.max((g.f||1)-1,0)});g.f=Math.max((g.f||1)-1,0);load()}
      else if(e.target.dataset.f)modal('<img class="big" src="'+e.target.src+'" alt="Comprobante"><button class="g" id="bk">Volver</button>'),$("bk").onclick=()=>gasMod(id);
    };
  };
  load();
  $("gp").onclick=()=>$("gi").click();
  $("gi").onchange=async e=>{let n=0;for(const f of e.target.files){try{await setDoc(doc(fc(cur,id),nid()),{x:await comp(f),c:Date.now()});n++}catch(x){}}
    if(n){g.f=(g.f||0)+n;await updateDoc(doc(gc(cur),id),{f:g.f})}load()};
  $("gd").onclick=async function(){
    if(this.dataset.s!=="1"){this.dataset.s="1";this.textContent="¿Seguro? Toca otra vez para borrar";return}
    this.disabled=true;await delG(cur,id);shut();
  };
}
</script>
</body>
</html>
