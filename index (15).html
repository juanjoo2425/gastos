<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4fb;--card:#fff;--tx:#18213d;--mut:#6c7793;--bd:#e4e9f4;--soft:#f1f4fb;--btn:#1f3a9a;--acc:#2f55d4;--ok:#12a37f;--bad:#ef5b45;--empty:#e3e8f3;--sh:0 10px 30px rgba(31,58,154,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1224;--card:#151e38;--tx:#eaeefb;--mut:#8f9bbd;--bd:#232e52;--soft:#1c2748;--btn:#3b5bdb;--acc:#7b95ff;--ok:#2ed3a8;--bad:#ff7a64;--empty:#26335a;--sh:0 10px 30px rgba(0,0,0,.4)}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:600px;margin:0 auto;padding:18px 16px 56px}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:0;color:var(--tx)}
h2{font-size:16px;font-weight:800;margin:0 0 12px;color:var(--tx)}
.c{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.top,.ch-row{display:flex;gap:8px;align-items:center}
.top{justify-content:space-between;margin-bottom:14px}
.ch-row{overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none}
.ch-row::-webkit-scrollbar{display:none}
input,button{font:600 16px/1.2 Manrope,system-ui,Arial,sans-serif;border-radius:14px;border:0;padding:14px;background:var(--soft);color:var(--tx);min-width:0}
input{width:100%}
.md{grid-template-columns:minmax(0,1fr)}
input::placeholder{color:var(--mut);font-weight:500}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{cursor:pointer;transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.97)}
.ch{flex:none;border-radius:999px;padding:9px 16px;font-size:14px;background:var(--card);box-shadow:0 2px 8px rgba(31,58,154,.08)}
.ch.on{background:var(--btn);color:#fff;box-shadow:0 6px 16px rgba(31,58,154,.3)}
.b{background:var(--btn);color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(31,58,154,.28)}
.g{background:var(--soft);color:var(--tx)}
.dg{background:transparent;color:var(--bad)}
.gh{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px}
.f{display:grid;grid-template-columns:1fr 120px;gap:10px}
.f .b,.f .g,.pv,.full{grid-column:1/-1}
#sum{background:linear-gradient(140deg,#14205c 0%,#2a4bb8 100%);color:#fff;padding:20px}
.hl{font-size:12px;font-weight:700;opacity:.75;letter-spacing:.2px}
.hb{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.hg{display:flex;justify-content:space-between;align-items:flex-end}
#sum .bar{background:rgba(255,255,255,.22);height:10px;margin:16px 0 10px}
.bar{height:10px;border-radius:10px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;transition:width .5s}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k div{background:var(--soft);border-radius:16px;padding:12px}
.k span{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.k b{font-size:18px;font-weight:800}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
.r:last-child{border:0;padding-bottom:0}
.d{width:12px;height:12px;border-radius:50%;flex:none}
.av{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.n .t{display:block;overflow:hidden;text-overflow:ellipsis}
.n small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:3px;white-space:normal}
.p{font-weight:800;width:56px;text-align:right}
.m{width:98px;text-align:right;color:var(--mut);font-weight:600}
.amt{color:var(--tx);font-weight:800;font-size:15px}
.li{cursor:pointer}
.e{color:var(--mut);font-size:14px;text-align:center;padding:22px 10px;border:2px dashed var(--bd);border-radius:16px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,16,40,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:up .25s ease}
.md::before{content:"";width:42px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 6px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.md{animation:none}.bar i{transition:none}}
.th{display:flex;flex-wrap:wrap;gap:8px}
.th div{position:relative}
.th img{width:94px;height:94px;object-fit:cover;border-radius:14px;cursor:zoom-in;display:block}
.th div button{position:absolute;top:4px;right:4px;padding:0 8px;font-size:16px;background:rgba(0,0,0,.6);color:#fff;border-radius:9px}
.big{max-width:100%;max-height:80vh;border-radius:14px}
.er{color:var(--bad);font-size:13px;font-weight:600}
.tg{font-size:11px;border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:800}
.tg.o{background:#fde9e7;color:#b3261e}.tg.k{background:#d9efe3;color:#1e6b45}
.dr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.st div{background:var(--soft);border-radius:16px;padding:12px}
.st span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.st b{font-size:16px;font-weight:800}
.mb{display:flex;gap:8px;margin-bottom:6px}.mb input{flex:1}
.brand{width:64px;height:64px;border-radius:20px;background:linear-gradient(140deg,#14205c,#2a4bb8);display:grid;place-items:center;font-size:32px;margin:0 auto;box-shadow:0 10px 24px rgba(31,58,154,.35)}
.sl{cursor:pointer;transition:transform .18s,filter .18s;transform-origin:150px 150px}.sl:hover{transform:scale(1.045);filter:brightness(1.06)}svg text{pointer-events:none}.gh2{border-radius:18px;padding:16px;color:#fff}.gc{background:var(--soft);border-radius:16px;padding:12px;display:grid;gap:8px;margin-top:10px}.gr{display:flex;justify-content:space-between;align-items:center;gap:8px}.gr b{font-size:18px;font-weight:800}.gr small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:2px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div id="ov" class="ov" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,updateDoc,getDocs,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== PEGA AQUÍ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps > Web) ===== */
const firebaseConfig={apiKey:"AIzaSyDWew9r_6XbZLol7Vvh4Bk0s8s8Uk88asM",authDomain:"mis-gastos-30291.firebaseapp.com",projectId:"mis-gastos-30291",storageBucket:"mis-gastos-30291.firebasestorage.app",messagingSenderId:"887277831553",appId:"1:887277831553:web:7bb99ecb81b07d4098d480"};
/* ========================================================================================= */

const COL=["#3caa35","#4a72b8","#e8401c","#f39c12","#8e5bb5","#1abc9c","#e91e8c","#795548","#00a8cc","#b8b800","#ff7f50","#5c6bc0"];
const $=i=>document.getElementById(i), app=$("app"), ov=$("ov");
const fm=n=>n.toLocaleString("es-PE",{style:"currency",currency:"PEN"});
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML.replace(/"/g,"&quot;")};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let auth,db,U=null,P=[],G=[],cur=null,unsubP=null,unsubG=null,pend=[],per="all",q="",onlyd=false;
const pc=()=>collection(db,"users",U.uid,"pasteles");
const gc=p=>collection(db,"users",U.uid,"pasteles",p,"gastos");
const fc=(p,g)=>collection(db,"users",U.uid,"pasteles",p,"gastos",g,"fotos");

if(firebaseConfig.apiKey==="PEGA_AQUI"){
  app.innerHTML='<div class="c"><h1>Falta la configuración</h1><p>Pega tu firebaseConfig en index.html (donde dice PEGA AQUÍ) y vuelve a subir la app.</p></div>';
}else{
  auth=getAuth(initializeApp(firebaseConfig));db=getFirestore();
  onAuthStateChanged(auth,u=>{U=u;if(unsubP)unsubP();if(unsubG)unsubG();u?start():login()});
}

const EMAIL="gastos@mis-gastos.app",PASS="alexus";
function login(msg){
  app.innerHTML='<div class="c" style="display:grid;gap:10px;margin-top:40px"><div class="brand">🥧</div><h1 style="text-align:center">Mis gastos</h1><p style="margin:0;color:var(--mut);text-align:center;font-weight:600">Escribe tu contraseña para entrar.</p><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="b" id="go">Entrar</button><div class="er" id="er">'+(msg||"")+'</div></div>';
  const er=t=>$("er").textContent=t;
  const enter=async()=>{
    if($("pw").value.trim().toLowerCase()!==PASS)return er("Contraseña incorrecta");
    $("go").disabled=true;er("Entrando…");
    try{await signInWithEmailAndPassword(auth,EMAIL,PASS)}
    catch(e){
      try{await createUserWithEmailAndPassword(auth,EMAIL,PASS)}
      catch(e2){const x=e2.code==="auth/email-already-in-use"?e:e2;er("No se pudo entrar: "+(x.code||x.message));$("go").disabled=false}
    }
  };
  $("go").onclick=enter;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
}

function start(){
  app.innerHTML='<div class="top"><h1>Mis gastos</h1><button class="g" id="out">Salir</button></div><div class="ch-row" id="chips"></div><div class="c" id="sum"></div><div class="ch-row" id="fl"></div><div class="c"><h2 id="pt">¿En qué se fue el dinero?</h2><div id="pie"></div><div id="lg"></div></div><div class="c"><h2>Agregar gasto</h2><div class="f"><input id="nm" placeholder="¿En qué lo gastaste?" maxlength="40" autocomplete="off"><input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="S/ 0.00"><input id="dt" type="date" class="full"><div class="th full" id="qk"></div><input id="db" class="full" placeholder="¿Quién te debe esto? (opcional)" maxlength="30"><button class="g" id="ph">📷 Adjuntar comprobante</button><input id="pf" type="file" accept="image/*" multiple hidden><div class="th pv" id="pv"></div><button class="b" id="ad">Agregar</button></div></div><div class="c" id="dd" hidden></div><div class="c" id="ins"></div><div class="c"><div class="mb"><input id="q" placeholder="Buscar gasto"><button class="g" id="csv">Exportar Excel</button></div><div id="ls" style="margin-top:6px"></div></div>';
  $("out").onclick=()=>signOut(auth);
  $("ph").onclick=()=>$("pf").click();
  $("pf").onchange=async e=>{for(const f of e.target.files){try{pend.push(await comp(f))}catch(x){}}e.target.value="";prev()};
  $("ad").onclick=addG;
$("dt").value=iso(Date.now());
const gk=e=>{const t=e.target.closest("[data-k]");if(t)grpMod(t.dataset.k)};$("pie").onclick=gk;$("lg").onclick=gk;
$("fl").onclick=e=>{const t=e.target.dataset.t;if(t==="deb"){onlyd=!onlyd;draw()}else if(t){per=t;draw()}};
$("dd").onclick=e=>{const k=e.target.dataset.d;if(!k)return;const L=G.filter(g=>g.dr&&!g.pg&&g.dr.toLowerCase()===k);if(L.length)payMod(L.map(g=>g.id),"Pago de "+L[0].dr)};
$("qk").onclick=e=>{const n=e.target.dataset.q;if(n!==undefined){$("nm").value=n;$("am").focus()}};
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
$("csv").onclick=()=>{const R=[["Fecha","Concepto","Monto","Comprobantes","Deudor","Estado"]].concat(G.filter(g=>inPer(g.d)).map(g=>[iso(g.d),(g.n||"").trim(),g.m,g.f||0,g.dr||"",g.dr?(g.pg?"Pagado":"Pendiente"):""]));
  const t="\ufeff"+R.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n"),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=P0().name+".csv";a.click()};

  ["nm","am"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")addG()}));
  $("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="np")return pasMod();pick(b.dataset.p)};
  $("sum").onclick=e=>{if(e.target.id==="ed")pasMod(cur)};
  $("ls").onclick=e=>{const r=e.target.closest(".li");if(r)gasMod(r.dataset.g)};
  unsubP=onSnapshot(pc(),s=>{
    P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.c-b.c);
    if(!P.length){setDoc(doc(pc(),"prestamo"),{name:"Préstamo",loan:14000,c:Date.now()});return}
    let sv=null;try{sv=localStorage.getItem("gp_cur")}catch(e){}
    if(!P.some(p=>p.id===cur))pick(P.some(p=>p.id===sv)?sv:P[0].id);else chips();
    sumr();
  });
}
function pick(id){
  cur=id;try{localStorage.setItem("gp_cur",id)}catch(e){}
  if(unsubG)unsubG();G=[];draw();
  unsubG=onSnapshot(gc(id),s=>{G=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.d-b.d);draw()});
  chips();
}
const P0=()=>P.find(p=>p.id===cur)||{name:"",loan:0};
function chips(){$("chips").innerHTML=P.map(p=>'<button class="ch'+(p.id===cur?" on":"")+'" data-p="'+p.id+'">'+esc(p.name)+'</button>').join("")+'<button class="ch" id="np">+ Nuevo pastel</button>'}
function groups(L){
  const m={},o=[];
  (L||G).forEach(it=>{const nm=(it.n||"").trim()||"Sin descripción",k=nm.toLowerCase();if(!m[k]){m[k]={n:nm,k,m:0,c:COL[o.length%COL.length]};o.push(m[k])}m[k].m+=it.m});
  return o.sort((a,b)=>b.m-a.m);
}
function payMod(ids,t){
  let ph=[];
  modal('<h2>'+esc(t)+'</h2><div style="font-size:14px;color:var(--mut)">'+(ids.length>1?"Se marcarán "+ids.length+" gastos como pagados. El comprobante se guarda en el primero.":"Opcional: sube la foto del comprobante de pago.")+'</div><div class="th" id="pp"></div><button class="g" id="pa">📷 Subir comprobante de pago</button><input id="pi" type="file" accept="image/*" multiple hidden><button class="b" id="pc">Confirmar pago</button><button class="g" id="pq">Cancelar</button>');
  const pv=()=>{$("pp").innerHTML=ph.map((x,i)=>'<div><img src="'+x+'" alt="Comprobante de pago"><button data-i="'+i+'">×</button></div>').join("")};
  $("pp").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){ph.splice(+i,1);pv()}};
  $("pa").onclick=()=>$("pi").click();
  $("pi").onchange=async e=>{for(const f of e.target.files){try{ph.push(await comp(f))}catch(x){}}e.target.value="";pv()};
  $("pq").onclick=shut;
  $("pc").onclick=async function(){
    this.disabled=true;const b=writeBatch(db);
    ids.forEach((id,i)=>{const g=G.find(x=>x.id===id);b.update(doc(gc(cur),id),{pg:true,f:(g.f||0)+(i?0:ph.length)})});
    ph.forEach(x=>b.set(doc(fc(cur,ids[0]),nid()),{x,c:Date.now(),p:1}));
    try{await b.commit();shut()}catch(e){alert("No se pudo guardar: "+(e.code||e.message));this.disabled=false}
  };
}
function sumr(){
  const p=P0(),tot=G.reduce((t,i)=>t+i.m,0),av=p.loan-tot;
  let h='<div class="top" style="margin:0 0 16px"><span style="font-size:15px;font-weight:800">'+esc(p.name)+'</span><button class="gh" id="ed">Editar</button></div><div class="hg"><div><div class="hl">Total gastado</div><div class="hb">'+fm(tot)+'</div></div><div style="text-align:right"><div class="hl">Gastos</div><div class="hb">'+G.length+'</div></div></div>';
  if(p.loan>0){const pc=tot/p.loan*100;
    h+='<div class="bar"><i style="width:'+Math.min(pc,100)+'%;background:'+(av<0?"#ff8a76":"#52e2b9")+'"></i></div><div class="hl" style="display:flex;justify-content:space-between;gap:8px"><span>Préstamo '+fm(p.loan)+'</span><span>Disponible <b style="font-size:13px">'+fm(Math.max(av,0))+'</b></span></div>'+(av<0?'<div style="margin-top:8px;font-size:13px;font-weight:800;color:#ffb3a6">Te pasaste por '+fm(-av)+'</div>':"");
  }
  $("sum").innerHTML=h;
}
function pie(gs,tot){
  let s='<svg viewBox="0 0 300 300" role="img" aria-label="Gráfico de gastos">';
  if(!tot)return s+'<circle cx="150" cy="150" r="140" fill="var(--empty)"/><text x="150" y="155" text-anchor="middle" fill="var(--mut)" font-size="15" font-family="Arial">Agrega tu primer gasto</text></svg>';
  let a=-Math.PI/2;
  gs.forEach(g=>{
    const f=g.m/tot,b=a+f*2*Math.PI,mid=(a+b)/2;
    if(gs.length===1)s+='<circle cx="150" cy="150" r="140" fill="'+g.c+'" class="sl" data-k="'+esc(g.k)+'"/>';
    else s+='<path d="M150 150L'+(150+140*Math.cos(a)).toFixed(2)+' '+(150+140*Math.sin(a)).toFixed(2)+'A140 140 0 '+(f>.5?1:0)+' 1 '+(150+140*Math.cos(b)).toFixed(2)+' '+(150+140*Math.sin(b)).toFixed(2)+'Z" fill="'+g.c+'" stroke="#fff" stroke-width="3" class="sl" data-k="'+esc(g.k)+'"/>';
    if(f>=.07){const x=(150+Math.cos(mid)*84).toFixed(1),y=150+Math.sin(mid)*84,n=g.n.length>12?g.n.slice(0,11)+"…":g.n;
      s+='<text x="'+x+'" y="'+y.toFixed(1)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="22">'+Math.round(f*100)+'%</text><text x="'+x+'" y="'+(y+16).toFixed(1)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="12">'+esc(n)+'</text>'}
    a=b;
  });
  return s+'</svg>';
}
const MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const PER=[["all","Todo"],["m","Este mes"],["pm","Mes pasado"],["7","Últimos 7 días"]];
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)};
function inM(d,o){const n=new Date(),p=new Date(n.getFullYear(),n.getMonth()+o,1),x=new Date(d);return x.getMonth()===p.getMonth()&&x.getFullYear()===p.getFullYear()}
function inPer(d){return per==="all"||(per==="m"&&inM(d,0))||(per==="pm"&&inM(d,-1))||(per==="7"&&d>=Date.now()-7*864e5)}
function fl(){$("fl").innerHTML=PER.map(a=>'<button class="ch'+(a[0]===per?" on":"")+'" data-t="'+a[0]+'">'+a[1]+'</button>').join("")+'<button class="ch'+(onlyd?" on":"")+'" data-t="deb">Deudas pendientes</button>'}
function ins(){
  const p=P0(),tot=G.reduce((t,i)=>t+i.m,0);
  if(!G.length){$("ins").innerHTML='<h2>Análisis</h2><div class="e">Agrega gastos para ver tu ritmo, proyección y tendencia.</div>';return}
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),first=Math.min(...G.map(g=>g.d)),days=Math.max(1,Math.ceil((Date.now()-first)/864e5)),avg=tot/days;
  const hoy=G.filter(g=>g.d>=t0).reduce((t,g)=>t+g.m,0),mes=G.filter(g=>inM(g.d,0)).reduce((t,g)=>t+g.m,0),big=G.reduce((a,g)=>g.m>a.m?g:a,G[0]);
  let run="";
  if(p.loan>0){const av=p.loan-tot;run=av<0?"Ya te pasaste del total por "+fm(-av):avg>0?"A este ritmo ("+fm(avg)+" por día) tu dinero alcanza unos "+Math.floor(av/avg)+" días, hasta el "+new Date(Date.now()+av/avg*864e5).toLocaleDateString("es-PE"):""}
  const mb=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);mb.push({l:MES[d.getMonth()],v:G.filter(g=>inM(g.d,-i)).reduce((t,g)=>t+g.m,0)})}
  const mx=Math.max(...mb.map(x=>x.v),1);let svg='<svg viewBox="0 0 300 115" role="img" aria-label="Gasto por mes">';
  mb.forEach((x,i)=>{const h=x.v/mx*70,xx=i*50+8;svg+='<rect x="'+xx+'" y="'+(88-h)+'" width="34" height="'+Math.max(h,1)+'" rx="5" fill="var(--acc)"/><text x="'+(xx+17)+'" y="104" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="Arial">'+x.l+'</text>'+(x.v?'<text x="'+(xx+17)+'" y="'+(82-h)+'" text-anchor="middle" font-size="10" fill="var(--tx)" font-family="Arial">'+Math.round(x.v)+'</text>':"")});
  $("ins").innerHTML='<h2>Análisis</h2>'+(run?'<b style="font-size:14px">'+run+'</b>':"")+'<div class="st"><div><span>Gasto de hoy</span><b>'+fm(hoy)+'</b></div><div><span>Este mes</span><b>'+fm(mes)+'</b></div><div><span>Promedio por día</span><b>'+fm(avg)+'</b></div><div><span>Gasto promedio</span><b>'+fm(tot/G.length)+'</b></div><div class="full"><span>Mayor gasto</span><b>'+esc((big.n||"").trim()||"Sin descripción")+" · "+fm(big.m)+'</b></div></div><h2 style="margin-top:14px">Gasto por mes (S/)</h2>'+svg+'</svg>';
}
function debts(){
  const m={};G.filter(g=>g.dr).forEach(g=>{const k=g.dr.toLowerCase();m[k]=m[k]||{n:g.dr,o:0,p:0};if(g.pg)m[k].p+=g.m;else m[k].o+=g.m});
  const A=Object.keys(m).map(k=>({k,...m[k]})).sort((a,b)=>b.o-a.o),o=A.reduce((t,x)=>t+x.o,0),p=A.reduce((t,x)=>t+x.p,0),d=$("dd");
  if(!A.length){d.hidden=true;return}
  d.hidden=false;
  d.innerHTML='<h2>Deudores</h2><div class="k"><div><span>Por cobrar</span><b style="color:var(--bad)">'+fm(o)+'</b></div><div><span>Ya pagado</span><b style="color:var(--ok)">'+fm(p)+'</b></div></div><div style="margin-top:8px">'+A.map(x=>'<div class="dr"><span class="n">'+esc(x.n)+'</span><span>'+(x.o?'<b>'+fm(x.o)+'</b> debe':'<span style="color:var(--ok)">Al día</span>')+'</span>'+(x.o?'<button class="g" style="padding:6px 10px;font-size:13px" data-d="'+esc(x.k)+'">Marcar pagado</button>':"")+'</div>').join("")+'</div>';
}
function draw(){
  if(!$("pie"))return;
  const L=G.filter(g=>inPer(g.d)),tot=L.reduce((t,i)=>t+i.m,0),gs=groups(L);
  sumr();ins();fl();debts();
  $("pt").textContent="¿En qué se fue el dinero? · "+PER.find(a=>a[0]===per)[1];
  $("pie").innerHTML=pie(gs,tot);
  $("lg").innerHTML=gs.map(g=>'<div class="r li" data-k="'+esc(g.k)+'"><span class="d" style="background:'+g.c+'"></span><span class="n">'+esc(g.n)+'</span><span class="p">'+(g.m/tot*100).toFixed(1)+'%</span><span class="m">'+fm(g.m)+'</span></div>').join("");
  $("qk").innerHTML=groups().slice(0,6).map(g=>'<button class="ch" data-q="'+esc(g.n)+'">'+esc(g.n)+'</button>').join("");
  const cm={};groups().forEach(g=>cm[g.n.toLowerCase()]=g.c);
  const V=L.filter(g=>(!q||((g.n||"")+" "+(g.dr||"")).toLowerCase().includes(q))&&(!onlyd||(g.dr&&!g.pg))).reverse();
  $("ls").innerHTML=V.length?V.map(it=>{const d=new Date(it.d),nm=(it.n||"").trim()||"Sin descripción";return '<div class="r li" data-g="'+it.id+'"><span class="av" style="background:'+(cm[nm.toLowerCase()]||"#8a94b0")+'">'+esc(nm.charAt(0).toUpperCase())+'</span><span class="n"><span class="t">'+esc(nm)+'</span><small>'+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+(it.f?" · 📎"+it.f:"")+(it.dr?'<span class="tg '+(it.pg?"k":"o")+'">'+(it.pg?"Pagado":"Debe")+" · "+esc(it.dr)+'</span>':"")+'</small></span><span class="m amt">'+fm(it.m)+'</span></div>'}).join(""):'<div class="e">'+(G.length?"No hay gastos con ese filtro.":"Todavía no hay gastos en este pastel.")+'</div>';
}
async function grpMod(k){
  const P1=G.filter(g=>inPer(g.d)),L=P1.filter(g=>((g.n||"").trim()||"Sin descripción").toLowerCase()===k).sort((a,b)=>b.d-a.d);
  if(!L.length)return;
  const tot=L.reduce((t,g)=>t+g.m,0),all=P1.reduce((t,g)=>t+g.m,0),nm=(L[0].n||"").trim()||"Sin descripción",c=(groups().find(x=>x.k===k)||{}).c||"#4a72b8";
  modal('<div class="gh2" style="background:'+c+'"><div style="font-size:12px;font-weight:700;opacity:.9">'+L.length+(L.length===1?" gasto":" gastos")+' · '+(all?(tot/all*100).toFixed(1):0)+'% del total gastado</div><div style="font-size:22px;font-weight:800;margin-top:2px">'+esc(nm)+'</div><div class="hb">'+fm(tot)+'</div></div><div class="st" style="margin:0"><div><span>Promedio</span><b>'+fm(tot/L.length)+'</b></div><div><span>Con comprobante</span><b>'+L.filter(g=>g.f).length+" de "+L.length+'</b></div></div><div id="gl"><div class="e">Cargando comprobantes…</div></div><button class="g" id="gx">Cerrar</button>');
  $("gx").onclick=shut;
  const fs=await Promise.all(L.map(g=>g.f?getDocs(fc(cur,g.id)).then(s=>s.docs.map(d=>d.data())).catch(()=>[]):[]));
  if(!$("gl"))return;
  $("gl").innerHTML=L.map((g,i)=>{const d=new Date(g.d);return '<div class="gc"><div class="gr"><div><b>'+fm(g.m)+'</b><small>'+d.toLocaleDateString("es-PE")+(g.dr?' · <span class="tg '+(g.pg?"k":"o")+'" style="margin:0">'+(g.pg?"Pagado":"Debe")+" · "+esc(g.dr)+'</span>':"")+'</small></div><button class="g" data-e="'+g.id+'" style="padding:7px 14px;font-size:13px">Editar</button></div>'+(fs[i].length?'<div class="th">'+fs[i].map(f=>'<div><img src="'+f.x+'" alt="Comprobante" data-z="1">'+(f.p?'<span class="tg k" style="position:absolute;left:4px;bottom:4px;margin:0">Pago</span>':"")+'</div>').join("")+'</div>':'<small style="color:var(--mut);font-weight:600">Sin comprobantes</small>')+'</div>'}).join("");
  $("gl").onclick=e=>{
    if(e.target.dataset.e)return gasMod(e.target.dataset.e);
    if(e.target.dataset.z){modal('<img class="big" src="'+e.target.src+'" alt="Comprobante"><button class="g" id="bk">Volver</button>');$("bk").onclick=()=>grpMod(k)}
  };
}
function prev(){$("pv").innerHTML=pend.map((x,i)=>'<div><img src="'+x+'" alt="Comprobante"><button data-i="'+i+'">×</button></div>').join("");$("pv").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){pend.splice(+i,1);prev()}}}
function comp(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.width,h=im.height;const s=1280/Math.max(w,h);if(s<1){w*=s;h*=s}const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL("image/jpeg",q);while(d.length>750000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}URL.revokeObjectURL(u);ok(d)};im.onerror=no;im.src=u})}
async function addG(){
  const m=parseFloat($("am").value);if(!(m>0)){$("am").focus();return}
  const b=writeBatch(db),g=doc(gc(cur));
  b.set(g,{n:$("nm").value,m:Math.round(m*100)/100,d:$("dt").value?new Date($("dt").value+"T12:00").getTime():Date.now(),f:pend.length,dr:$("db").value.trim(),pg:false});
  pend.forEach(x=>b.set(doc(fc(cur,g.id),nid()),{x,c:Date.now()}));
  $("ad").disabled=true;
  try{await b.commit();$("nm").value="";$("am").value="";$("dt").value=iso(Date.now());$("db").value="";pend=[];prev()}catch(e){alert("No se pudo guardar: "+(e.code||e.message))}
  $("ad").disabled=false;$("nm").focus();
}
function modal(h){ov.innerHTML='<div class="md">'+h+'</div>';ov.hidden=false;ov.onclick=e=>{if(e.target===ov)shut()}}
function shut(){ov.hidden=true;ov.innerHTML=""}
function pasMod(id){
  const p=id?P0():{name:"",loan:0};
  modal('<h2>'+(id?"Editar pastel":"Nuevo pastel")+'</h2><input id="pn" placeholder="Nombre (ej. Gastos personales)" maxlength="30" value="'+esc(p.name)+'"><input id="pl" type="number" inputmode="decimal" min="0" placeholder="Monto total (opcional)" value="'+(p.loan||"")+'"><button class="b" id="ps">Guardar</button>'+(id&&P.length>1?'<button class="dg" id="pd">Borrar pastel</button>':"")+'<button class="g" id="px">Cancelar</button>');
  $("px").onclick=shut;
  $("ps").onclick=async()=>{const name=$("pn").value.trim();if(!name){$("pn").focus();return}const d={name,loan:parseFloat($("pl").value)||0};
    if(id)await updateDoc(doc(pc(),id),d);else{const r=doc(pc());await setDoc(r,{...d,c:Date.now()});shut();return pick(r.id)}shut()};
  if($("pd"))$("pd").onclick=async function(){
    if(this.dataset.s!=="1"){this.dataset.s="1";this.textContent="¿Seguro? Se borran sus gastos y fotos. Toca otra vez";return}
    this.disabled=true;const gs=await getDocs(gc(id));for(const g of gs.docs)await delG(id,g.id);
    await deleteDoc(doc(pc(),id));cur=null;shut();
  };
}
async function delG(p,g){const fs=await getDocs(fc(p,g)),b=writeBatch(db);fs.docs.forEach(f=>b.delete(f.ref));b.delete(doc(gc(p),g));await b.commit()}
async function gasMod(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  const d=new Date(g.d);
  modal('<h2>Detalle del gasto</h2><input id="en" value="'+esc(g.n||"")+'" placeholder="¿En qué?" maxlength="40"><div class="mb"><input id="ea" type="number" inputmode="decimal" step="0.01" value="'+g.m+'"><input id="ed" type="date" value="'+iso(g.d)+'"></div><input id="er" value="'+esc(g.dr||"")+'" placeholder="Deudor (quién te debe)" maxlength="30"><button class="b" id="es">Guardar cambios</button><button class="g" id="pg">'+(g.pg?"Marcar como pendiente":"Marcar como pagado")+'</button><div class="th" id="gf"><span class="e">Cargando comprobantes…</span></div><button class="g" id="gp">📷 Agregar comprobante</button><input id="gi" type="file" accept="image/*" multiple hidden><button class="g" id="du">Duplicar gasto</button><button class="dg" id="gd">Borrar gasto</button><button class="g" id="gx">Cerrar</button>');
  $("gx").onclick=shut;
  $("es").onclick=async()=>{const m=parseFloat($("ea").value);if(!(m>0))return;await updateDoc(doc(gc(cur),id),{n:$("en").value,dr:$("er").value.trim(),m:Math.round(m*100)/100,d:$("ed").value?new Date($("ed").value+"T12:00").getTime():g.d});shut()};
  $("du").onclick=async()=>{await setDoc(doc(gc(cur)),{n:g.n||"",m:g.m,d:Date.now(),f:0,dr:g.dr||"",pg:false});shut()};
  $("pg").onclick=async()=>{if(g.pg){await updateDoc(doc(gc(cur),id),{pg:false});shut()}else payMod([id],"Marcar como pagado")};
  const load=async()=>{
    const fs=await getDocs(fc(cur,id));
    $("gf").innerHTML=fs.docs.length?fs.docs.map(f=>'<div><img src="'+f.data().x+'" alt="Comprobante" data-f="'+f.id+'"><button data-x="'+f.id+'">×</button>'+(f.data().p?'<span class="tg k" style="position:absolute;left:2px;bottom:2px;margin:0">Pago</span>':"")+'</div>').join(""):'<span class="e">Sin comprobantes.</span>';
    $("gf").onclick=async e=>{
      if(e.target.dataset.x){await deleteDoc(doc(fc(cur,id),e.target.dataset.x));await updateDoc(doc(gc(cur),id),{f:Math.max((g.f||1)-1,0)});g.f=Math.max((g.f||1)-1,0);load()}
      else if(e.target.dataset.f)modal('<img class="big" src="'+e.target.src+'" alt="Comprobante"><button class="g" id="bk">Volver</button>'),$("bk").onclick=()=>gasMod(id);
    };
  };
  load();
  $("gp").onclick=()=>$("gi").click();
  $("gi").onchange=async e=>{let n=0;for(const f of e.target.files){try{await setDoc(doc(fc(cur,id),nid()),{x:await comp(f),c:Date.now()});n++}catch(x){}}
    if(n){g.f=(g.f||0)+n;await updateDoc(doc(gc(cur),id),{f:g.f})}load()};
  $("gd").onclick=async function(){
    if(this.dataset.s!=="1"){this.dataset.s="1";this.textContent="¿Seguro? Toca otra vez para borrar";return}
    this.disabled=true;await delG(cur,id);shut();
  };
}
